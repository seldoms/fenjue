<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="370" rx="16" fill="#f6f8fa"/>
  <text x="40" y="52" font-size="24" font-weight="bold" fill="#1f2328">搜索：顺藤摸瓜，由点及面</text>
  <g font-size="15" fill="#1f2328" text-anchor="middle">
    <rect x="36" y="86" width="120" height="64" rx="10" fill="#dbeafe"/>
    <text x="96" y="112" font-weight="bold">第一步</text>
    <text x="96" y="136">搜出十个站</text>
    <rect x="180" y="86" width="120" height="64" rx="10" fill="#bfdbfe"/>
    <text x="240" y="112" font-weight="bold">第二步</text>
    <text x="240" y="136">认出真官网</text>
    <rect x="324" y="86" width="120" height="64" rx="10" fill="#93c5fd"/>
    <text x="384" y="112" font-weight="bold">第三步</text>
    <text x="384" y="136">避开假按钮</text>
    <rect x="468" y="86" width="120" height="64" rx="10" fill="#60a5fa"/>
    <text x="528" y="112" font-weight="bold">第四步</text>
    <text x="528" y="136">回头找密码</text>
    <rect x="612" y="86" width="112" height="64" rx="10" fill="#3b82f6"/>
    <text x="668" y="112" font-weight="bold" fill="#ffffff">第五步</text>
    <text x="668" y="136" fill="#ffffff">装好能用</text>
  </g>
  <g stroke="#57606a" stroke-width="2">
    <path d="M158 118h18M302 118h18M446 118h18M590 118h18" marker-end="none"/>
  </g>
  <g font-size="16" fill="#57606a">
    <text x="163" y="124">›</text>
    <text x="307" y="124">›</text>
    <text x="451" y="124">›</text>
    <text x="595" y="124">›</text>
  </g>
  <path d="M384 152 C 384 200, 300 205, 210 218" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <text x="120" y="212" font-size="16" font-weight="bold" fill="#16a34a">由点及面：</text>
  <g font-size="15" fill="#1f2328" text-anchor="middle">
    <rect x="216" y="196" width="130" height="52" rx="10" fill="#dcfce7"/>
    <text x="281" y="228">想去掉广告</text>
    <rect x="382" y="196" width="130" height="52" rx="10" fill="#bbf7d0"/>
    <text x="447" y="228">发现插件</text>
    <rect x="548" y="196" width="160" height="52" rx="10" fill="#86efac"/>
    <text x="628" y="228">打开一个新世界</text>
  </g>
  <g font-size="16" fill="#57606a">
    <text x="352" y="228">›</text>
    <text x="518" y="228">›</text>
  </g>
  <text x="40" y="300" font-size="15" fill="#1f2328">顺藤摸瓜，是一节一节往下追；由点及面，是从一个点跳到一类事。两样都有，才叫会解决问题。</text>
  <text x="40" y="332" font-size="14" fill="#57606a">搜索不是打字，是顺着线索找路的本事——它堵着，后面什么好东西都进不来。</text>
</svg>
