<svg xmlns="http://www.w3.org/2000/svg" width="760" height="448" viewBox="0 0 760 448" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="448" rx="16" fill="#f6f8fa"/>
  <text x="40" y="52" font-size="24" font-weight="bold" fill="#1f2328">好、快、便宜：只能挑两个（不可能三角）</text>
  <g fill-opacity="0.45">
    <circle cx="290" cy="185" r="102" fill="#60a5fa"/>
    <circle cx="470" cy="185" r="102" fill="#4ade80"/>
    <circle cx="380" cy="268" r="102" fill="#fbbf24"/>
  </g>
  <g font-size="22" font-weight="bold" fill="#1f2328" text-anchor="middle">
    <text x="238" y="152">好</text>
    <text x="522" y="152">快</text>
    <text x="380" y="338">便宜</text>
  </g>
  <g font-size="14" fill="#1f2328" text-anchor="middle">
    <text x="380" y="140">又好又快</text>
    <text x="380" y="160" font-weight="bold">→ 不便宜</text>
    <text x="272" y="252">又好又便宜</text>
    <text x="272" y="272" font-weight="bold">→ 不快</text>
    <text x="488" y="252">又快又便宜</text>
    <text x="488" y="272" font-weight="bold">→ 不好</text>
  </g>
  <text x="380" y="222" text-anchor="middle" font-size="17" font-weight="bold" fill="#b91c1c">✕ 不存在</text>
  <text x="40" y="402" font-size="14" fill="#57606a">谁跟你宣传三个全占，谁就是在骗你——不是骗钱，就是骗数据。</text>
  <text x="40" y="424" font-size="14" fill="#57606a">选工具前先想清：这件活，哪个角不能让。</text>
</svg>
